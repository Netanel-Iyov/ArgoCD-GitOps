apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 87.19.1

    helm:
      releaseName: monitoring

      values: |
        grafana:
          enabled: true

          persistence:
            enabled: true
            storageClassName: nfs-csi-default-storageclass
            accessModes:
              - ReadWriteOnce
            size: 10Gi

        prometheus:
          enabled: true

          prometheusSpec:
            retention: 15d

            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: nfs-csi-default-storageclass
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 50Gi

        prometheusOperator:
          enabled: true
          createCustomResource: true
          admissionWebhooks:
            enabled: true

            annotations:
              argocd.argoproj.io/hook: PreSync
              argocd.argoproj.io/hook-delete-policy: HookFailed

            patch:
              annotations:
                argocd.argoproj.io/hook: PreSync
                argocd.argoproj.io/hook-delete-policy: HookFailed

            mutatingWebhookConfiguration:
              annotations:
                argocd.argoproj.io/hook: PreSync

            validatingWebhookConfiguration:
              annotations:
                argocd.argoproj.io/hook: PreSync

        alertmanager:
          enabled: true

          alertmanagerSpec:
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: nfs-csi-default-storageclass
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 10Gi

        nodeExporter:
          enabled: true

        kubeStateMetrics:
          enabled: true
        
        crds:
          enabled: true

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true