apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: grafana
    targetRevision: '12.8.0'
    helm:
      releaseName: grafana
      values: |
        persistence:
          enabled: true
          storageClassName: nfs-csi-default-storageclass
          size: 5Gi

        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: Prometheus
                type: prometheus
                access: proxy
                url: http://prometheus-server.prometheus.svc.cluster.local
                isDefault: true

        # Sidecar watches ConfigMaps labeled grafana_dashboard and loads them
        # automatically. Required for the gnetId-based imports below.
        sidecar:
          dashboards:
            enabled: true
            label: grafana_dashboard
            labelValue: "1"

        # Dashboards imported directly from grafana.com by ID (downloaded as
        # JSON at deploy time and provisioned automatically via the sidecar).
        dashboards:
          default:
            node-exporter-full:
              gnetId: 1860
              revision: 45
              datasource: Prometheus
            kubernetes-cluster-monitoring:
              gnetId: 315
              revision: 3
              datasource: Prometheus

        ingress:
          enabled: true
          ingressClassName: nginx
          annotations:
            nginx.ingress.kubernetes.io/ssl-redirect: "true"
          hosts:
            - grafana.niyov.com
          path: /
          pathType: Prefix
          tls:
            - secretName: niyov-wildcard-tls
              hosts:
                - grafana.niyov.com
  destination:
    server: https://kubernetes.default.svc
    namespace: grafana
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
