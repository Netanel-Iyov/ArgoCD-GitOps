apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: grafana
    targetRevision: '12.8.0'
    helm:
      releaseName: grafana
      values: |
        persistence:
          enabled: true
          storageClassName: nfs-csi-default-storageclass
          size: 5Gi

        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: Prometheus
                type: prometheus
                access: proxy
                url: http://prometheus-server.prometheus.svc.cluster.local
                isDefault: true

        # Tells Grafana where to find provisioned dashboard JSON files on disk.
        # Required for the gnetId-based imports below - without this, the
        # downloaded JSON sits on disk but Grafana never loads it.
        dashboardProviders:
          dashboardproviders.yaml:
            apiVersion: 1
            providers:
              - name: 'default'
                orgId: 1
                folder: ''
                type: file
                disableDeletion: false
                editable: true
                options:
                  path: /var/lib/grafana/dashboards/default

        # Dashboards imported directly from grafana.com by ID. The chart's
        # download-dashboards init container fetches the JSON at pod startup
        # and writes it into /var/lib/grafana/dashboards/default, where the
        # provider above picks it up.
        dashboards:
          default:
            node-exporter-full:
              gnetId: 1860
              revision: 45
              datasource: Prometheus
            # kubernetes-cluster-monitoring:
            #   gnetId: 14205
            #   revision: 1
            #   datasource: Prometheus
            # kubernetes-namespaces-monitoring:
            #   gnetId: 15758
            #   revision: 46
            #   datasource: Prometheus
            k8s-compute-resources-cluster:
              gnetId: 12114
              revision: 1
              datasource: Prometheus
            k8s-compute-resources-namespace-pods:
              gnetId: 12117
              revision: 1
              datasource: Prometheus
            k8s-compute-resources-node-pods:
              gnetId: 12119
              revision: 1
              datasource: Prometheus
            k8s-compute-resources-workload:
              gnetId: 12121
              revision: 1
              datasource: Prometheus
            k8s-compute-resources-pod:
              gnetId: 14438
              revision: 1
              datasource: Prometheus

        ingress:
          enabled: true
          ingressClassName: nginx
          annotations:
            nginx.ingress.kubernetes.io/ssl-redirect: "true"
          hosts:
            - grafana.niyov.com
          path: /
          pathType: Prefix
          tls:
            - secretName: niyov-wildcard-tls
              hosts:
                - grafana.niyov.com
  destination:
    server: https://kubernetes.default.svc
    namespace: grafana
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
