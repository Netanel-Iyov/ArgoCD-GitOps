apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus
    targetRevision: '29.19.0'
    helm:
      releaseName: prometheus
      values: |
        server:
          persistentVolume:
            enabled: true
            storageClass: nfs-csi-default-storageclass
            size: 20Gi
          # extraScrapeConfigs: |
          #   - job_name: jenkins
          #     metrics_path: /prometheus/
          #     static_configs:
          #       - targets:
          #         - jenkins.niyov.com
          # NodePort service on the local network only. Reachable at any
          # cluster node's IP on this fixed port - not exposed via ingress,
          # so it's only accessible from devices on the home LAN, not the
          # internet.
          service:
            type: NodePort
            nodePort: 30000

        alertmanager:
          persistence:
            enabled: true
            storageClass: nfs-csi-default-storageclass
            size: 2Gi
          # NodePort on the home LAN only, mirrors alertmanager's default port (9093).
          service:
            type: NodePort
            nodePort: 30093

        prometheus-pushgateway:
          # NodePort on the home LAN only, mirrors pushgateway's default port (9091).
          service:
            type: NodePort
            nodePort: 30091
  destination:
    server: https://kubernetes.default.svc
    namespace: prometheus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
