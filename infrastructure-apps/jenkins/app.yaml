apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jenkins
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://charts.jenkins.io'
    chart: jenkins
    targetRevision: 5.8.133
    helm:
      releaseName: jenkins
      values: |
        persistence:
          enabled: true
          existingClaim: jenkins-pvc

        controller:
          componentName: "jenkins-controller"
          serviceType: ClusterIP
          # Pod-level: Ensures the volume is mounted for GID 2000
          podSecurityContext:
            runAsUser: 2000
            runAsGroup: 2000
            fsGroup: 2000
          
          # Container-level: Forces the Jenkins process to start as 2000
          containerSecurityContext:
            runAsUser: 2000
            runAsGroup: 2000
          
          # This tells the init container (which fixes permissions) to use 2000
          initContainerEnv:
            - name: "DEFAULT_CHOWN"
              value: "false" # Prevents it from trying to chown back to 1000

          # Ensure the main controller also knows about the cache location
          initContainerEnv:
            - name: "CACHE_DIR"
              value: "/var/jenkins_home/.cache"

          # Ingress Configuration
          ingress:
            enabled: true
            ingressClassName: nginx
            apiVersion: "networking.k8s.io/v1"
            hostName: jenkins.niyov.com
            annotations:
              kubernetes.io/ingress.class: nginx
              nginx.ingress.kubernetes.io/ssl-redirect: "true"
            tls:
              - secretName: niyov-wildcard-tls
                hosts:
                  - jenkins.niyov.com
          # Ensure Jenkins knows its external URL for redirects
          jenkinsUrl: "https://jenkins.niyov.com"
          installPlugins:
            - kubernetes:7.3.1-256.v788a_0b_787114
            - configuration-as-code:2037.v8e5349845172
            - git:5.9.0
            - workflow-aggregator:latest608.v67378e9d3db_1
            - credentials-binding:702.vfe613e537e88
            - locale:614.va_6a_5a_1a_f2b_38
            - job-dsl:1.93
          JCasC:
            defaultConfig: true
            configScripts:
              ui-settings: |
                jenkins:
                  systemMessage: "Welcome to my home-lab CI/CD platform. This Application is Managed by ArgoCD"
                appearance:
                  locale:
                    systemLocale: en
                    ignoreAcceptLanguage: true
                    allowUserPreferences: false
              k8s-integration: |
                jenkins:
                  clouds:
                    - kubernetes:
                        name: "niyov-k8s-cluster"
                        serverUrl: "https://kubernetes.default.svc.cluster.local"
                        namespace: "jenkins"
                        jenkinsUrl: "http://jenkins.jenkins.svc.cluster.local:8080"
                        templates:
                          - name: "default-agent"
                            label: "default-agent"
                            nodeUsageMode: NORMAL
                            containers:
                              - name: "jnlp"
                                image: "jenkins/inbound-agent:latest"
                              - name: "default-k8s-tools-container"
                                image: "alpine/k8s:1.29.1"
                                command: "cat"
                                ttyEnabled: true
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: jenkins
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true