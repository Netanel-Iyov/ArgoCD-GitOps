apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jenkins
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://charts.jenkins.io'
    chart: jenkins
    targetRevision: 5.8.133
    helm:
      releaseName: jenkins
      values: |
        persistence:
          enabled: true
          storageClass: nfs-csi-default-storageclass
          size: 30Gi
          accessMode: ReadWriteOnce # Only one jenkins controller is allowed

        agent: 
          websocket: true

        controller:
          componentName: "jenkins-controller"
          serviceType: ClusterIP

          # Ingress Configuration
          ingress:
            enabled: true
            ingressClassName: nginx
            apiVersion: "networking.k8s.io/v1"
            hostName: jenkins.niyov.com
            annotations:
              kubernetes.io/ingress.class: nginx
              nginx.ingress.kubernetes.io/ssl-redirect: "true"
            tls:
              - secretName: niyov-wildcard-tls
                hosts:
                  - jenkins.niyov.com
          # Ensure Jenkins knows its external URL for redirects
          jenkinsUrl: "https://jenkins.niyov.com"
          installPlugins:
            - kubernetes
            - configuration-as-code
            - git
            - workflow-aggregator
            - credentials-binding
            - locale
            - job-dsl
            - envinject
            - generic-webhook-trigger
            - pipeline-utility-steps
            - rebuild
          JCasC:
            defaultConfig: true
            configScripts:
              ui-settings: |
                jenkins:
                  systemMessage: "Welcome to my home-lab CI/CD platform. This Application is Managed by ArgoCD"
                appearance:
                  locale:
                    systemLocale: en
                    ignoreAcceptLanguage: true
                    allowUserPreferences: false

              k8s-integration: |
                jenkins:
                  clouds:
                    - kubernetes:
                        name: "niyov-k8s-cluster"
                        serverUrl: "https://kubernetes.default.svc.cluster.local"
                        namespace: "jenkins"
                        jenkinsUrl: "http://jenkins.jenkins.svc.cluster.local:8080"
                        webSocket: true
                        templates:
                          - name: "default-k8s-agent"
                            label: "default-k8s-agent"
                            nodeUsageMode: NORMAL
                            containers:
                              - name: "jnlp"
                                image: "jenkins/inbound-agent:latest"
                              - name: "default-k8s-tools-container"
                                image: "alpine/k8s:1.29.1"
                                command: "cat"
                                ttyEnabled: true

              security: |
                security:
                  globalJobDslSecurityConfiguration:
                    useScriptSecurity: false

              seed-job: |
                jobs:
                  - script: >
                      pipelineJob('seed-job-dsl') {
                        description('Seeds Jenkins jobs from Job DSL repository')

                        definition {
                          cps {
                            script('''
                              pipeline {
                                agent { 
                                  label 'default-k8s-agent'
                                }

                                parameters {
                                  string(name: 'BRANCH',  defaultValue: 'main', description: 'Branch to Seed DSL Jobs From')
                                }

                                environment {
                                  PRODUCTION_ENV  = 'true'
                                }

                                stages {
                                  stage('Checkout DSL repo') {
                                    steps {
                                      git branch: params.BRANCH, url: 'https://github.com/Netanel-Iyov/Jenkins-Dsl.git'
                                    }
                                  }

                                  stage('Seed jobs') {
                                    steps {
                                      jobDsl(
                                        targets: '**/DSL**.groovy',
                                        removedJobAction: 'DELETE',
                                        removedViewAction: 'DELETE',
                                        lookupStrategy: 'SEED_JOB',
                                        additionalParameters: [PRODUCTION_ENV: env.PRODUCTION_ENV, BRANCH: params.BRANCH]
                                      )
                                    }
                                  }
                                }
                              }
                            ''')
                          }
                        }
                      }
                  - script: queue('seed-job-dsl') 
          initScripts:
            01-create-admin.groovy: |
              import jenkins.model.*
              import hudson.security.*
              import java.util.UUID
              import java.nio.file.*

              def instance = Jenkins.getInstance()

              def adminUser = "admin"
              def adminPass = UUID.randomUUID().toString()

              // Create admin account if it doesn't exist
              if (instance.securityRealm.createAccount(adminUser, adminPass) != null) {
                  println "Created admin user '${adminUser}' with password '${adminPass}'"
              }

              // Write the password to the "initialAdminPassword" file
              def secretsDir = new File(Jenkins.getInstance().getRootDir(), "secrets")
              if (!secretsDir.exists()) {
                  secretsDir.mkdirs()
              }
              def passwordFile = new File(secretsDir, "initialAdminPassword")
              passwordFile.text = adminPass
              println "Written initial admin password to ${passwordFile.absolutePath}"
              
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: jenkins
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true